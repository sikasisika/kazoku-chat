<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#faf6ef">
  <title>かんたんメモ</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #faf6ef;
      color: #3b302a;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e2d9cd;
      border-radius: 9999px;
    }
    /* ドラムロールピッカー用のスナップスクロール */
    .wheel-container {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
    }
    .wheel-item {
      scroll-snap-align: center;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <main id="swipe-area" class="w-full max-w-md mx-auto p-4 flex-1 flex flex-col min-h-screen">
    
    <!-- ヘッダー（タイトルがタブ名と連動） -->
    <header class="flex items-center justify-between py-2 mb-2">
      <div class="flex items-center space-x-2.5">
        <div id="header-icon-box" class="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-md shadow-amber-200">
          <i id="header-icon" data-lucide="shopping-basket" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 id="page-title" class="text-2xl font-black tracking-wide text-stone-800">お買い物</h1>
          <p id="today-display" class="text-xs font-bold text-stone-500"></p>
        </div>
      </div>
    </header>

    <!-- タブ切り替え（3つ：お買い物・学校・予定） -->
    <div class="grid grid-cols-3 gap-1.5 p-1 bg-stone-200/70 rounded-2xl mb-3 text-center">
      <button id="tab-shopping" onclick="switchCategory('shopping')" class="py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all bg-white text-amber-600 shadow-sm">
        <i data-lucide="shopping-basket" class="w-5 h-5"></i>
        <span class="text-xs">お買い物</span>
      </button>
      <button id="tab-school" onclick="switchCategory('school')" class="py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all text-stone-500">
        <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        <span class="text-xs">学校</span>
      </button>
      <button id="tab-schedule" onclick="switchCategory('schedule')" class="py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all text-stone-500">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-xs">予定</span>
      </button>
    </div>

    <!-- ===== 通常ビュー（お買い物・予定用） ===== -->
    <div id="standard-view" class="flex-1 flex flex-col">
      <!-- 予定カレンダー（予定タブ時のみ） -->
      <div id="calendar-wrapper" class="hidden mb-3 bg-white rounded-2xl p-4 shadow-sm border border-stone-200/80">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <span id="cal-month-year" class="font-extrabold text-stone-800 text-lg"></span>
            <button onclick="goToTodayMonth()" class="text-xs bg-amber-100 text-amber-700 font-bold px-2 py-1 rounded-lg">今日</button>
          </div>
          <div class="flex items-center space-x-1">
            <button onclick="changeMonth(-1)" class="p-2 hover:bg-stone-100 rounded-lg text-stone-600">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <button onclick="changeMonth(1)" class="p-2 hover:bg-stone-100 rounded-lg text-stone-600">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs mb-1 text-stone-400">
          <div class="text-red-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-sky-400">土</div>
        </div>
        <div id="cal-days-grid" class="grid grid-cols-7 gap-1 text-center text-sm font-bold"></div>
      </div>

      <!-- 入力フォーム -->
      <form id="todo-form" onsubmit="handleFormSubmit(event)" class="mb-2 relative flex items-center">
        <input
          type="text"
          id="todo-input"
          placeholder="買うものを入力..."
          class="w-full bg-white border-2 border-stone-300 focus:border-amber-500 rounded-2xl py-3.5 pl-4 pr-20 text-stone-800 text-base placeholder-stone-400 shadow-sm outline-none"
          autocomplete="off"
        >
        <button
          type="submit"
          class="absolute right-1.5 top-1.5 bottom-1.5 bg-stone-800 hover:bg-stone-900 active:scale-95 text-white font-bold px-4 rounded-xl flex items-center justify-center text-sm shadow-sm"
        >
          <i data-lucide="plus" class="w-4 h-4 mr-0.5"></i>
          追加
        </button>
      </form>

      <!-- よく使う候補（学習式） -->
      <div id="frequent-container" class="hidden mb-3 items-center flex-wrap gap-1.5 text-xs text-stone-600 px-1">
        <span class="text-stone-400 font-bold flex items-center mr-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-0.5 text-amber-500"></i>よく使う:
        </span>
        <div id="frequent-chips" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- リストステータス -->
      <div class="flex items-center justify-between px-2 py-1 text-xs font-bold text-stone-500 mb-1">
        <span id="category-badge-label" class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          お買い物リスト
        </span>
        <span id="remaining-count">あと 0 つ</span>
      </div>

      <!-- メモ一覧 -->
      <ul id="todo-list" class="space-y-2.5 overflow-y-auto flex-1 custom-scrollbar pb-6"></ul>
    </div>

    <!-- ===== 学校専用ビュー（基本1週間表示・上スクロールで次週出現） ===== -->
    <div id="school-view" class="hidden flex-1 flex flex-col">
      <div class="bg-white rounded-2xl p-3 shadow-sm border border-stone-200/80 mb-2 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span id="school-current-week-label" class="text-base font-black text-stone-800"></span>
          <button onclick="resetToCurrentWeek()" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded-lg">今週へ</button>
        </div>
        <span class="text-[11px] font-bold text-stone-400">↓ スクロールで次週へ</span>
      </div>

      <!-- 表の見出し -->
      <div class="grid grid-cols-12 gap-1 text-xs font-extrabold text-stone-500 bg-stone-100 p-2 rounded-xl border border-stone-200/70 text-center mb-1">
        <div class="col-span-3">ひにち</div>
        <div class="col-span-4 border-l border-stone-200">じかん</div>
        <div class="col-span-5 border-l border-stone-200">よてい・もちもの</div>
      </div>

      <!-- 1週間ごとの区切りリスト（スクロール対応） -->
      <div id="school-weeks-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pb-12"></div>
    </div>

  </main>

  <!-- 学校予定の編集ポップアップ（ルーレットピッカー付き） -->
  <div id="school-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between mb-3 border-b border-stone-100 pb-2">
        <div>
          <span class="text-xs font-bold text-emerald-600">学校の予定</span>
          <h3 id="school-modal-title" class="text-xl font-black text-stone-800"></h3>
        </div>
        <button onclick="closeSchoolModal()" class="p-2 hover:bg-stone-100 rounded-full text-stone-400">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form onsubmit="handleSchoolSave(event)" class="space-y-3 overflow-y-auto custom-scrollbar pr-1">
        
        <!-- じかん入力エリア -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-extrabold text-stone-600">じかん（下校時刻など）</label>
            <button type="button" onclick="toggleTimeInputMode()" id="toggle-input-mode-btn" class="text-[11px] font-bold text-emerald-600 hover:underline">
              文字で手入力する
            </button>
          </div>

          <!-- クイック選択タグ -->
          <div class="flex flex-wrap gap-1 mb-2">
            <button type="button" onclick="setQuickTime('5時間授業')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">5時間</button>
            <button type="button" onclick="setQuickTime('6時間授業')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">6時間</button>
            <button type="button" onclick="setQuickTime('給食後下校')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">給食後</button>
            <button type="button" onclick="setQuickTime('午前授業')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">午前</button>
          </div>

          <!-- ルーレット風ホイールピッカー -->
          <div id="wheel-picker-wrapper" class="relative bg-stone-50 border-2 border-stone-200 rounded-2xl p-2 h-36 flex items-center justify-center overflow-hidden">
            <!-- 選択ライン -->
            <div class="absolute inset-x-2 h-9 bg-emerald-500/15 border-y-2 border-emerald-500 rounded-lg pointer-events-none"></div>

            <!-- 「時」ホイール -->
            <div id="wheel-hours" class="wheel-container w-20 h-full overflow-y-scroll text-center py-12 custom-scrollbar"></div>
            <span class="text-base font-black text-stone-700 mx-2">:</span>
            <!-- 「分」ホイール（5分刻み） -->
            <div id="wheel-minutes" class="wheel-container w-20 h-full overflow-y-scroll text-center py-12 custom-scrollbar"></div>
          </div>

          <!-- 手入力モード用インプット（デフォルトは非表示） -->
          <div id="text-time-wrapper" class="hidden">
            <input
              type="text"
              id="school-input-time-text"
              placeholder="例: 14:30、5時間授業 など"
              class="w-full bg-stone-50 border-2 border-stone-200 focus:border-emerald-500 rounded-xl py-2.5 px-3 text-sm text-stone-800 outline-none"
            >
          </div>
        </div>

        <!-- よてい・もちもの入力エリア -->
        <div>
          <label class="block text-xs font-extrabold text-stone-600 mb-1">よてい・もちもの</label>
          <input
            type="text"
            id="school-input-event"
            placeholder="例: 遠足、習字セット、保護者会 など"
            class="w-full bg-stone-50 border-2 border-stone-200 focus:border-emerald-500 rounded-xl py-2.5 px-3 text-sm text-stone-800 outline-none"
          >
        </div>

        <p class="text-[10px] text-stone-400 font-bold">※ 入力した内容は「予定」のカレンダーにも自動反映されます。</p>

        <div class="flex space-x-2 pt-2">
          <button
            type="button"
            onclick="handleSchoolClear()"
            class="w-1/3 py-2.5 rounded-xl border border-stone-300 text-stone-500 font-bold text-xs hover:bg-stone-50"
          >
            クリア
          </button>
          <button
            type="submit"
            class="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-sm rounded-xl shadow-sm"
          >
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const categories = ['shopping', 'school', 'schedule'];
    let currentCategory = 'shopping';
    let todos = JSON.parse(localStorage.getItem('kantan_todos') || '[]');
    let wordUsage = JSON.parse(localStorage.getItem('kantan_word_usage') || '{}');
    let schoolData = JSON.parse(localStorage.getItem('kantan_school_data') || '{}');

    const todayDate = new Date();
    const todayISO = `${todayDate.getFullYear()}-${String(todayDate.getMonth() + 1).padStart(2, '0')}-${String(todayDate.getDate()).padStart(2, '0')}`;
    
    let selectedScheduleDate = todayISO;
    let calDisplayYear = todayDate.getFullYear();
    let calDisplayMonth = todayDate.getMonth();

    // 学校ページ用
    let selectedSchoolDate = todayISO;
    let isTimeTextMode = false;
    let selectedWheelHour = '14';
    let selectedWheelMinute = '30';

    function init() {
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('today-display').textContent = 
        `${todayDate.getFullYear()}年${todayDate.getMonth() + 1}月${todayDate.getDate()}日 (${days[todayDate.getDay()]})`;

      initWheelPicker();
      switchCategory('shopping');
      setupSwipeGestures();
    }

    // スワイプ切り替え
    function setupSwipeGestures() {
      let touchStartX = 0;
      let touchStartY = 0;
      const swipeArea = document.getElementById('swipe-area');

      swipeArea.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      swipeArea.addEventListener('touchend', e => {
        const diffX = e.changedTouches[0].screenX - touchStartX;
        const diffY = e.changedTouches[0].screenY - touchStartY;

        if (Math.abs(diffX) > 60 && Math.abs(diffY) < 50) {
          const currentIndex = categories.indexOf(currentCategory);
          if (diffX < 0) {
            if (currentIndex < categories.length - 1) switchCategory(categories[currentIndex + 1]);
          } else {
            if (currentIndex > 0) switchCategory(categories[currentIndex - 1]);
          }
        }
      }, { passive: true });
    }

    // カテゴリ切り替え（3タブ）
    function switchCategory(cat) {
      currentCategory = cat;
      const tabs = {
        shopping: document.getElementById('tab-shopping'),
        school: document.getElementById('tab-school'),
        schedule: document.getElementById('tab-schedule')
      };

      const titleMap = {
        shopping: { title: 'お買い物', icon: 'shopping-basket', color: 'bg-amber-500', shadow: 'shadow-amber-200' },
        school: { title: '学校', icon: 'graduation-cap', color: 'bg-emerald-600', shadow: 'shadow-emerald-200' },
        schedule: { title: '予定', icon: 'calendar', color: 'bg-sky-500', shadow: 'shadow-sky-200' }
      };

      const meta = titleMap[cat];
      document.getElementById('page-title').textContent = meta.title;
      
      const iconBox = document.getElementById('header-icon-box');
      iconBox.className = `w-10 h-10 rounded-2xl ${meta.color} text-white flex items-center justify-center shadow-md ${meta.shadow}`;
      iconBox.innerHTML = `<i data-lucide="${meta.icon}" class="w-6 h-6"></i>`;

      Object.keys(tabs).forEach(key => {
        tabs[key].className = 'py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all text-stone-500';
      });

      const activeTabColors = {
        shopping: 'bg-white text-amber-600 shadow-sm',
        school: 'bg-white text-emerald-700 shadow-sm',
        schedule: 'bg-white text-sky-600 shadow-sm'
      };
      tabs[cat].className = `py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all ${activeTabColors[cat]}`;

      const standardView = document.getElementById('standard-view');
      const schoolView = document.getElementById('school-view');
      const calWrapper = document.getElementById('calendar-wrapper');
      const input = document.getElementById('todo-input');

      if (cat === 'school') {
        standardView.classList.add('hidden');
        schoolView.classList.remove('hidden');
        renderSchoolWeeksView();
      } else {
        standardView.classList.remove('hidden');
        schoolView.classList.add('hidden');

        if (cat === 'schedule') {
          calWrapper.classList.remove('hidden');
          renderCalendar();
          updateScheduleInputPlaceholder();
        } else {
          calWrapper.classList.add('hidden');
          input.placeholder = '買うものを入力...';
        }
        renderFrequentChips();
        renderTodos();
      }
      lucide.createIcons();
    }

    // ===== 学校ページ：1週間ベース＆上スワイプで次週へ =====
    function renderSchoolWeeksView() {
      const container = document.getElementById('school-weeks-container');
      container.innerHTML = '';

      // 今週の月曜を基準日として算出
      const curr = new Date(todayDate);
      const day = curr.getDay();
      const diff = curr.getDate() - day + (day === 0 ? -6 : 1); // 月曜日
      const monday = new Date(curr.setDate(diff));

      document.getElementById('school-current-week-label').textContent = 
        `${monday.getMonth() + 1}月${monday.getDate()}日の週〜`;

      // 4週間分を一気に生成（上スクロールでスムーズに次週が現れる）
      for (let w = 0; w < 4; w++) {
        const weekStart = new Date(monday);
        weekStart.setDate(monday.getDate() + (w * 7));

        const weekBox = document.createElement('div');
        weekBox.className = 'space-y-1.5';

        const weekHeader = document.createElement('div');
        weekHeader.className = 'text-xs font-black text-emerald-800 bg-emerald-50/80 px-3 py-1 rounded-lg border border-emerald-100 flex items-center justify-between';
        weekHeader.innerHTML = `
          <span>${w === 0 ? '【今週】' : w === 1 ? '【来週】' : `【${w + 1}週目】`} ${weekStart.getMonth() + 1}月${weekStart.getDate()}日〜</span>
        `;
        weekBox.appendChild(weekHeader);

        const weekDays = ['月', '火', '水', '木', '金', '土', '日'];
        for (let d = 0; d < 7; d++) {
          const targetDay = new Date(weekStart);
          targetDay.setDate(weekStart.getDate() + d);

          const y = targetDay.getFullYear();
          const m = String(targetDay.getMonth() + 1).padStart(2, '0');
          const dateNum = String(targetDay.getDate()).padStart(2, '0');
          const dStr = `${y}-${m}-${dateNum}`;
          
          const info = schoolData[dStr] || { time: '', event: '' };
          const isToday = dStr === todayISO;
          const dayName = weekDays[d];

          let dayColor = 'text-stone-700';
          if (dayName === '土') dayColor = 'text-sky-500 font-extrabold';
          if (dayName === '日') dayColor = 'text-red-500 font-extrabold';

          const row = document.createElement('div');
          row.className = `grid grid-cols-12 gap-1 p-2.5 rounded-xl border items-center cursor-pointer transition-all active:scale-[0.99] ${
            isToday ? 'bg-amber-50/90 border-amber-300 shadow-2xs' : 'bg-white border-stone-200/80 hover:border-emerald-300'
          }`;
          row.onclick = () => openSchoolModal(dStr);

          row.innerHTML = `
            <div class="col-span-3 text-xs font-black ${dayColor} flex items-center">
              <span>${targetDay.getDate()} (${dayName})</span>
              ${isToday ? '<span class="ml-1 w-1.5 h-1.5 rounded-full bg-amber-500"></span>' : ''}
            </div>
            <div class="col-span-4 text-xs font-bold text-stone-700 truncate pl-1 border-l border-stone-100">
              ${info.time ? escapeHtml(info.time) : '<span class="text-stone-300 font-normal">-</span>'}
            </div>
            <div class="col-span-5 text-xs font-bold text-stone-800 truncate pl-1 border-l border-stone-100 flex items-center justify-between">
              <span class="truncate">${info.event ? escapeHtml(info.event) : '<span class="text-stone-300 font-normal">よていなし</span>'}</span>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-stone-300 flex-shrink-0"></i>
            </div>
          `;
          weekBox.appendChild(row);
        }

        container.appendChild(weekBox);
      }
      lucide.createIcons();
    }

    function resetToCurrentWeek() {
      const container = document.getElementById('school-weeks-container');
      container.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ===== ルーレット風ホイールピッカー =====
    function initWheelPicker() {
      const hWheel = document.getElementById('wheel-hours');
      const mWheel = document.getElementById('wheel-minutes');
      hWheel.innerHTML = '';
      mWheel.innerHTML = '';

      // 時間 (07〜18時)
      for (let h = 7; h <= 18; h++) {
        const val = String(h).padStart(2, '0');
        const item = document.createElement('div');
        item.className = 'wheel-item h-9 flex items-center justify-center font-extrabold text-lg text-stone-700';
        item.textContent = val;
        item.dataset.value = val;
        hWheel.appendChild(item);
      }

      // 分 (00〜55分・5分刻み)
      for (let m = 0; m < 60; m += 5) {
        const val = String(m).padStart(2, '0');
        const item = document.createElement('div');
        item.className = 'wheel-item h-9 flex items-center justify-center font-extrabold text-lg text-stone-700';
        item.textContent = val;
        item.dataset.value = val;
        mWheel.appendChild(item);
      }

      // スクロール検知で値を更新
      hWheel.addEventListener('scroll', () => {
        const idx = Math.round(hWheel.scrollTop / 36);
        const child = hWheel.children[idx];
        if (child) selectedWheelHour = child.dataset.value;
      });

      mWheel.addEventListener('scroll', () => {
        const idx = Math.round(mWheel.scrollTop / 36);
        const child = mWheel.children[idx];
        if (child) selectedWheelMinute = child.dataset.value;
      });
    }

    function setWheelPosition(hour, minute) {
      const hWheel = document.getElementById('wheel-hours');
      const mWheel = document.getElementById('wheel-minutes');

      const hIndex = Math.max(0, parseInt(hour, 10) - 7);
      const mIndex = Math.max(0, Math.floor(parseInt(minute, 10) / 5));

      hWheel.scrollTop = hIndex * 36;
      mWheel.scrollTop = mIndex * 36;
      selectedWheelHour = String(hour).padStart(2, '0');
      selectedWheelMinute = String(minute).padStart(2, '0');
    }

    function toggleTimeInputMode() {
      isTimeTextMode = !isTimeTextMode;
      const wheelWrapper = document.getElementById('wheel-picker-wrapper');
      const textWrapper = document.getElementById('text-time-wrapper');
      const btn = document.getElementById('toggle-input-mode-btn');

      if (isTimeTextMode) {
        wheelWrapper.classList.add('hidden');
        textWrapper.classList.remove('hidden');
        btn.textContent = 'ルーレットで選ぶ';
      } else {
        wheelWrapper.classList.remove('hidden');
        textWrapper.classList.add('hidden');
        btn.textContent = '文字で手入力する';
      }
    }

    function setQuickTime(text) {
      isTimeTextMode = true;
      document.getElementById('wheel-picker-wrapper').classList.add('hidden');
      document.getElementById('text-time-wrapper').classList.remove('hidden');
      document.getElementById('toggle-input-mode-btn').textContent = 'ルーレットで選ぶ';
      document.getElementById('school-input-time-text').value = text;
    }

    // 学校モーダル開閉
    function openSchoolModal(dateStr) {
      selectedSchoolDate = dateStr;
      const parts = dateStr.split('-');
      const dObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('school-modal-title').textContent = `${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日 (${weekDays[dObj.getDay()]})`;

      const info = schoolData[dateStr] || { time: '', event: '' };
      document.getElementById('school-input-event').value = info.event || '';

      // 時間の判定（HH:mm形式ならルーレット、文字なら手入力欄）
      if (info.time && info.time.includes(':')) {
        const [h, m] = info.time.split(':');
        isTimeTextMode = false;
        document.getElementById('wheel-picker-wrapper').classList.remove('hidden');
        document.getElementById('text-time-wrapper').classList.add('hidden');
        document.getElementById('toggle-input-mode-btn').textContent = '文字で手入力する';
        setTimeout(() => setWheelPosition(h, m), 50);
      } else if (info.time) {
        isTimeTextMode = true;
        document.getElementById('wheel-picker-wrapper').classList.add('hidden');
        document.getElementById('text-time-wrapper').classList.remove('hidden');
        document.getElementById('toggle-input-mode-btn').textContent = 'ルーレットで選ぶ';
        document.getElementById('school-input-time-text').value = info.time;
      } else {
        // デフォルト（14:30）
        isTimeTextMode = false;
        document.getElementById('wheel-picker-wrapper').classList.remove('hidden');
        document.getElementById('text-time-wrapper').classList.add('hidden');
        document.getElementById('toggle-input-mode-btn').textContent = '文字で手入力する';
        setTimeout(() => setWheelPosition('14', '30'), 50);
      }

      document.getElementById('school-modal').classList.remove('hidden');
    }

    function closeSchoolModal() {
      document.getElementById('school-modal').classList.add('hidden');
    }

    function handleSchoolSave(e) {
      e.preventDefault();
      let timeVal = '';
      if (isTimeTextMode) {
        timeVal = document.getElementById('school-input-time-text').value.trim();
      } else {
        timeVal = `${selectedWheelHour}:${selectedWheelMinute}`;
      }

      const eventVal = document.getElementById('school-input-event').value.trim();

      if (!timeVal && !eventVal) {
        delete schoolData[selectedSchoolDate];
      } else {
        schoolData[selectedSchoolDate] = { time: timeVal, event: eventVal };
      }

      localStorage.setItem('kantan_school_data', JSON.stringify(schoolData));
      closeSchoolModal();
      renderSchoolWeeksView();
    }

    function handleSchoolClear() {
      document.getElementById('school-input-event').value = '';
      document.getElementById('school-input-time-text').value = '';
      delete schoolData[selectedSchoolDate];
      localStorage.setItem('kantan_school_data', JSON.stringify(schoolData));
      closeSchoolModal();
      renderSchoolWeeksView();
    }

    // ===== 予定タブ（カレンダー連動） =====
    function updateScheduleInputPlaceholder() {
      const parts = selectedScheduleDate.split('-');
      document.getElementById('todo-input').placeholder = `${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日の予定を入力...`;
    }

    function changeMonth(delta) {
      calDisplayMonth += delta;
      if (calDisplayMonth < 0) { calDisplayMonth = 11; calDisplayYear--; }
      else if (calDisplayMonth > 11) { calDisplayMonth = 0; calDisplayYear++; }
      renderCalendar();
    }

    function goToTodayMonth() {
      calDisplayYear = todayDate.getFullYear();
      calDisplayMonth = todayDate.getMonth();
      selectedScheduleDate = todayISO;
      updateScheduleInputPlaceholder();
      renderCalendar();
      renderTodos();
    }

    function renderCalendar() {
      document.getElementById('cal-month-year').textContent = `${calDisplayYear}年 ${calDisplayMonth + 1}月`;
      const grid = document.getElementById('cal-days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(calDisplayYear, calDisplayMonth, 1).getDay();
      const lastDate = new Date(calDisplayYear, calDisplayMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'py-2';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dStr = `${calDisplayYear}-${String(calDisplayMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        
        const hasSchool = schoolData[dStr] && (schoolData[dStr].event || schoolData[dStr].time);
        const hasSchedule = todos.some(t => t.category === 'schedule' && t.date === dStr && !t.completed);
        const hasAny = hasSchool || hasSchedule;

        const isSelected = dStr === selectedScheduleDate;
        const isToday = dStr === todayISO;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `py-2 rounded-xl flex flex-col items-center justify-center relative ${
          isSelected ? 'bg-sky-500 text-white shadow-sm font-black' : 
          isToday ? 'bg-amber-100 text-amber-800' : 'hover:bg-stone-100 text-stone-700'
        }`;

        btn.onclick = () => {
          selectedScheduleDate = dStr;
          updateScheduleInputPlaceholder();
          renderCalendar();
          renderTodos();
        };

        btn.innerHTML = `
          <span>${d}</span>
          ${hasAny ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : hasSchool ? 'bg-emerald-500' : 'bg-sky-500'} mt-0.5"></span>` : '<span class="w-1.5 h-1.5 mt-0.5"></span>'}
        `;
        grid.appendChild(btn);
      }
    }

    // ===== 通常タスク管理 =====
    function handleFormSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;

      addTodo(text);
      input.value = '';
    }

    function addTodo(text) {
      const newTodo = {
        id: 'todo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: text,
        category: currentCategory,
        completed: false,
        createdAt: Date.now()
      };

      if (currentCategory === 'schedule') {
        newTodo.date = selectedScheduleDate;
      }

      todos.push(newTodo);
      saveTodos();

      wordUsage[text] = (wordUsage[text] || 0) + 1;
      localStorage.setItem('kantan_word_usage', JSON.stringify(wordUsage));

      renderFrequentChips();
      renderTodos();
      if (currentCategory === 'schedule') renderCalendar();
    }

    function renderFrequentChips() {
      const container = document.getElementById('frequent-container');
      const chips = document.getElementById('frequent-chips');
      chips.innerHTML = '';

      const topWords = Object.entries(wordUsage)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(entry => entry[0]);

      if (topWords.length === 0) {
        container.classList.add('hidden');
        container.classList.remove('flex');
        return;
      }

      container.classList.remove('hidden');
      container.classList.add('flex');

      topWords.forEach(word => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'bg-white border border-stone-200/90 text-stone-700 px-2.5 py-1 rounded-full font-bold shadow-2xs active:bg-amber-50 flex items-center hover:border-amber-300';
        chip.innerHTML = `<span>+ ${escapeHtml(word)}</span>`;
        chip.onclick = () => addTodo(word);
        chips.appendChild(chip);
      });
    }

    function toggleTodo(id) {
      const item = todos.find(t => t.id === id);
      if (item) {
        item.completed = !item.completed;
        saveTodos();
        renderTodos();
        if (currentCategory === 'schedule') renderCalendar();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      saveTodos();
      renderTodos();
      if (currentCategory === 'schedule') renderCalendar();
    }

    function saveTodos() {
      localStorage.setItem('kantan_todos', JSON.stringify(todos));
    }

    function renderTodos() {
      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = '';

      let activeItems = [];
      let badgeLabel = '';
      let badgeColor = 'bg-amber-500';

      if (currentCategory === 'shopping') {
        activeItems = todos.filter(t => t.category === 'shopping');
        badgeLabel = 'お買い物リスト';
      } else if (currentCategory === 'schedule') {
        activeItems = todos.filter(t => t.category === 'schedule' && t.date === selectedScheduleDate);
        
        // 学校の予定があれば上部に表示
        if (schoolData[selectedScheduleDate]) {
          const s = schoolData[selectedScheduleDate];
          const fullText = [s.time ? `【${s.time}】` : '', s.event].filter(Boolean).join(' ');
          if (fullText) {
            activeItems.unshift({
              id: 'school_sched_item',
              text: fullText,
              isSchoolStatic: true,
              sourceLabel: '🏫 学校',
              sourceColor: 'text-emerald-700 bg-emerald-50'
            });
          }
        }

        const parts = selectedScheduleDate.split('-');
        badgeLabel = `${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日の予定`;
        badgeColor = 'bg-sky-500';
      }

      activeItems.sort((a, b) => {
        if (a.isSchoolStatic) return -1;
        if (b.isSchoolStatic) return 1;
        return (a.completed === b.completed ? b.createdAt - a.createdAt : a.completed ? 1 : -1);
      });

      const remaining = activeItems.filter(t => !t.completed).length;
      document.getElementById('remaining-count').textContent = `あと ${remaining} つ`;
      document.getElementById('category-badge-label').innerHTML = `
        <span class="w-2 h-2 rounded-full ${badgeColor}"></span>
        ${badgeLabel}
      `;

      if (activeItems.length === 0) {
        listEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 text-stone-400">
            <i data-lucide="smile" class="w-12 h-12 mb-2 stroke-1"></i>
            <p class="font-bold text-sm">メモはありません</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      activeItems.forEach(todo => {
        const li = document.createElement('li');
        li.className = `p-3.5 rounded-2xl border transition-all flex items-center justify-between ${
          todo.completed ? 'bg-stone-100/80 border-stone-200 opacity-60' : 'bg-white border-stone-200 shadow-sm'
        }`;

        if (todo.isSchoolStatic) {
          li.innerHTML = `
            <div class="flex items-center space-x-3 flex-1 min-w-0">
              <div class="w-7 h-7 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0">
                <i data-lucide="graduation-cap" class="w-4 h-4"></i>
              </div>
              <div class="flex-1 min-w-0 flex flex-col">
                <span class="text-[10px] font-black ${todo.sourceColor} px-1.5 py-0.5 rounded w-max mb-0.5">${todo.sourceLabel}</span>
                <span class="text-base font-bold text-stone-800 break-words">${escapeHtml(todo.text)}</span>
              </div>
            </div>
          `;
          listEl.appendChild(li);
          return;
        }

        li.innerHTML = `
          <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleTodo('${todo.id}')">
            <div class="w-7 h-7 rounded-xl border-2 flex items-center justify-center flex-shrink-0 transition-colors ${
              todo.completed ? 'bg-amber-500 border-amber-500 text-white' : 'border-stone-300 bg-stone-50'
            }">
              ${todo.completed ? '<i data-lucide="check" class="w-5 h-5 stroke-[3]"></i>' : ''}
            </div>
            <span class="text-base font-bold text-stone-800 break-words flex-1 min-w-0 ${todo.completed ? 'line-through text-stone-400 font-medium' : ''}">
              ${escapeHtml(todo.text)}
            </span>
          </div>
          <button onclick="deleteTodo('${todo.id}')" class="p-2 text-stone-300 hover:text-red-500 active:scale-90 transition-all rounded-lg" title="削除">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        `;
        listEl.appendChild(li);
      });

      lucide.createIcons();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.onload = init;
  </script>
</body>
</html>
