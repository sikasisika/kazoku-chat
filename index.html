<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#faf6ef">
  <title>かんたんメモ</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="かんたんメモ">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #faf6ef;
      color: #3b302a;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e2d9cd;
      border-radius: 9999px;
    }
    .wheel-container {
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
    }
    .wheel-item {
      scroll-snap-align: center;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

  <main id="main-container" class="w-full max-w-md mx-auto p-3 flex-1 flex flex-col h-screen overflow-hidden">
    
    <!-- ヘッダー -->
    <header class="flex items-center justify-between py-1 mb-1.5 flex-shrink-0">
      <div class="flex items-center space-x-2.5">
        <div id="header-icon-box" class="w-10 h-10 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-md shadow-amber-200">
          <i id="header-icon" data-lucide="shopping-basket" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 id="page-title" class="text-2xl font-black tracking-wide text-stone-800">お買い物</h1>
          <p id="today-display" class="text-xs font-bold text-stone-500"></p>
        </div>
      </div>
      <div id="sync-status" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-stone-200 text-stone-500">
        ローカル保存中
      </div>
    </header>

    <!-- タブ切り替え（お買い物・学校・カレンダー） -->
    <div class="grid grid-cols-3 gap-1.5 p-1 bg-stone-200/70 rounded-2xl mb-2 text-center flex-shrink-0">
      <button id="tab-shopping" onclick="switchCategory('shopping')" class="py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all bg-white text-amber-600 shadow-sm">
        <i data-lucide="shopping-basket" class="w-5 h-5"></i>
        <span class="text-xs">お買い物</span>
      </button>
      <button id="tab-school" onclick="switchCategory('school')" class="py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all text-stone-500">
        <i data-lucide="graduation-cap" class="w-5 h-5"></i>
        <span class="text-xs">学校</span>
      </button>
      <button id="tab-schedule" onclick="switchCategory('schedule')" class="py-2.5 px-2 rounded-xl font-bold flex flex-col items-center justify-center space-y-1 transition-all text-stone-500">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-xs">カレンダー</span>
      </button>
    </div>

    <!-- ===== 通常ビュー（お買い物・カレンダー） ===== -->
    <div id="standard-view" class="flex-1 flex flex-col min-h-0">
      
      <!-- カレンダー画面 -->
      <div id="calendar-wrapper" class="hidden flex-1 flex flex-col min-h-0">
        <div class="bg-white rounded-2xl p-3 shadow-sm border border-stone-200/80 mb-2 flex-shrink-0">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
              <span id="cal-month-year" class="font-extrabold text-stone-800 text-lg"></span>
              <button onclick="goToTodayMonth()" class="text-xs bg-amber-100 text-amber-700 font-bold px-2 py-1 rounded-lg">今月</button>
            </div>
            <div class="flex items-center space-x-1">
              <button onclick="changeMonth(-1)" class="p-1.5 hover:bg-stone-100 rounded-lg text-stone-600">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
              </button>
              <button onclick="changeMonth(1)" class="p-1.5 hover:bg-stone-100 rounded-lg text-stone-600">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </button>
            </div>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs mb-1 text-stone-400">
            <div class="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-sky-500">土</div>
          </div>
          <div id="cal-days-grid" class="grid grid-cols-7 gap-1 text-center text-sm font-bold"></div>
        </div>

        <!-- カレンダー下部：予定自動リスト -->
        <div class="flex-1 flex flex-col min-h-0 bg-white rounded-2xl p-3 shadow-sm border border-stone-200/80 mb-1 relative">
          <div class="flex items-center justify-between border-b border-stone-100 pb-2 mb-2 flex-shrink-0 relative">
            <div class="flex items-center space-x-2">
              <span id="calendar-auto-badge" class="text-[11px] font-black text-sky-700 bg-sky-50 px-2 py-0.5 rounded-md">今日の予定</span>
              <h3 id="calendar-auto-date-title" class="text-base font-black text-stone-800"></h3>
            </div>

            <button type="button" class="p-1.5 text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 rounded-xl" onclick="toggleCalendarHeaderMenu(event)">
              <i data-lucide="more-vertical" class="w-4 h-4"></i>
            </button>

            <div id="calendar-header-menu" class="hidden absolute right-0 top-9 z-30 bg-white border border-stone-200 rounded-2xl shadow-xl py-1.5 w-36 text-sm font-bold text-stone-700">
              <button type="button" onclick="promptAddCalendarTodo()" class="w-full text-left px-3.5 py-2 hover:bg-sky-50 text-sky-700 flex items-center">
                <i data-lucide="plus-circle" class="w-4 h-4 mr-2"></i>追加
              </button>
              <button type="button" onclick="promptEditSelectedDay()" class="w-full text-left px-3.5 py-2 hover:bg-stone-50 flex items-center">
                <i data-lucide="edit-3" class="w-4 h-4 mr-2 text-stone-500"></i>編集
              </button>
              <button type="button" onclick="promptClearSelectedDay()" class="w-full text-left px-3.5 py-2 hover:bg-red-50 text-red-600 flex items-center border-t border-stone-100">
                <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>消去
              </button>
            </div>
          </div>

          <div id="calendar-auto-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1"></div>
        </div>
      </div>

      <!-- 入力フォーム（お買い物専用） -->
      <form id="todo-form" onsubmit="handleFormSubmit(event)" class="mb-2 relative flex items-center flex-shrink-0">
        <input
          type="text"
          id="todo-input"
          placeholder="買うものを入力..."
          class="w-full bg-white border-2 border-stone-300 focus:border-amber-500 rounded-2xl py-3 pl-4 pr-20 text-stone-800 text-base placeholder-stone-400 shadow-sm outline-none"
          autocomplete="off"
        >
        <button
          type="submit"
          class="absolute right-1 top-1 bottom-1 bg-stone-800 hover:bg-stone-900 active:scale-95 text-white font-bold px-4 rounded-xl flex items-center justify-center text-sm shadow-sm"
        >
          <i data-lucide="plus" class="w-4 h-4 mr-0.5"></i>
          追加
        </button>
      </form>

      <!-- よく使う候補 -->
      <div id="frequent-container" class="hidden mb-2 items-center flex-wrap gap-1.5 text-xs text-stone-600 px-1 flex-shrink-0">
        <span class="text-stone-400 font-bold flex items-center mr-1">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 mr-0.5 text-amber-500"></i>よく使う:
        </span>
        <div id="frequent-chips" class="flex flex-wrap gap-1.5"></div>
      </div>

      <!-- リストステータス ＆ 一括消去ボタン -->
      <div id="shopping-statusbar" class="flex items-center justify-between px-2 py-1 text-xs font-bold text-stone-500 mb-1 flex-shrink-0">
        <span id="category-badge-label" class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          お買い物リスト
        </span>
        <div class="flex items-center space-x-2">
          <span id="remaining-count">あと 0 つ</span>
          <button
            id="clear-completed-btn"
            onclick="clearCompletedTodos()"
            class="hidden text-[11px] font-bold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-0.5 rounded-lg transition-all"
          >
            済を一括削除
          </button>
        </div>
      </div>

      <!-- メモ一覧 -->
      <ul id="todo-list" class="space-y-2 overflow-y-auto flex-1 custom-scrollbar pb-6"></ul>
    </div>

    <!-- ===== 学校ビュー ===== -->
    <div id="school-view" class="hidden flex-1 flex flex-col min-h-0">
      <!-- 上部バー（＋iPhoneカレンダー出力ボタン追加） -->
      <div class="bg-white rounded-2xl p-2 shadow-sm border border-stone-200/80 mb-2 flex items-center justify-between flex-shrink-0">
        
        <div class="flex bg-stone-100 p-0.5 rounded-xl text-xs font-bold">
          <button id="btn-school-mode-week" onclick="setSchoolMode('week')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white shadow-xs">週</button>
          <button id="btn-school-mode-month" onclick="setSchoolMode('month')" class="px-2.5 py-1 rounded-lg text-stone-600">月</button>
          <button id="btn-school-mode-year" onclick="setSchoolMode('year')" class="px-2.5 py-1 rounded-lg text-stone-600">年</button>
        </div>

        <div class="flex items-center space-x-1">
          <button onclick="changeSchoolPeriod(-1)" class="p-1 hover:bg-stone-100 rounded-lg text-stone-600">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
          </button>
          <span id="school-period-label" class="text-sm font-black text-stone-800 tracking-tight"></span>
          <button onclick="changeSchoolPeriod(1)" class="p-1 hover:bg-stone-100 rounded-lg text-stone-600">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex items-center space-x-1">
          <button onclick="exportToICS()" class="text-[11px] bg-sky-50 text-sky-700 border border-sky-200 font-bold px-2 py-1 rounded-lg flex items-center" title="iPhoneカレンダーに追加">
            <i data-lucide="download" class="w-3.5 h-3.5 mr-0.5"></i>書出
          </button>
          <button onclick="resetSchoolPeriod()" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded-lg">今</button>
        </div>
      </div>

      <!-- 1. 週表示モード -->
      <div id="school-week-stage" class="flex-1 flex flex-col justify-between py-0.5 space-y-1.5 touch-none overflow-hidden"></div>

      <!-- 2. 月表示モード（閲覧専用） -->
      <div id="school-month-stage" class="hidden flex-1 overflow-y-auto custom-scrollbar space-y-1.5 pb-6"></div>

      <!-- 3. 年表示モード（閲覧専用） -->
      <div id="school-year-stage" class="hidden flex-1 overflow-y-auto custom-scrollbar space-y-3 pb-6"></div>
    </div>

  </main>

  <!-- 学校：入力済み詳細モーダル -->
  <div id="school-detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col relative">
      <div class="flex items-center justify-between border-b border-stone-100 pb-2 mb-3">
        <div>
          <span class="text-xs font-bold text-emerald-600">学校の予定詳細</span>
          <h3 id="school-detail-date-title" class="text-xl font-black text-stone-800"></h3>
        </div>
        <div class="flex items-center space-x-1 relative">
          <button type="button" class="p-2 text-stone-500 hover:text-stone-800 bg-stone-100 hover:bg-stone-200 rounded-xl" onclick="toggleSchoolDetailMenu(event)">
            <i data-lucide="more-vertical" class="w-5 h-5"></i>
          </button>
          <button onclick="closeSchoolDetailModal()" class="p-2 hover:bg-stone-100 rounded-full text-stone-400">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>

          <div id="school-detail-menu" class="hidden absolute right-0 top-10 z-30 bg-white border border-stone-200 rounded-2xl shadow-xl py-1.5 w-32 text-sm font-bold text-stone-700">
            <button type="button" onclick="editFromSchoolDetail()" class="w-full text-left px-3.5 py-2 hover:bg-emerald-50 text-emerald-700 flex items-center">
              <i data-lucide="edit-3" class="w-4 h-4 mr-2"></i>編集
            </button>
            <button type="button" onclick="clearFromSchoolDetail()" class="w-full text-left px-3.5 py-2 hover:bg-red-50 text-red-600 flex items-center border-t border-stone-100">
              <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>クリア
            </button>
          </div>
        </div>
      </div>

      <div class="space-y-3.5 py-1">
        <div class="bg-emerald-50/70 p-3 rounded-2xl border border-emerald-100">
          <span class="text-[11px] font-black text-emerald-800 block mb-0.5">じかん</span>
          <p id="school-detail-time" class="text-lg font-black text-emerald-950"></p>
        </div>

        <div>
          <span class="text-[11px] font-black text-stone-400 block mb-0.5">よてい</span>
          <p id="school-detail-event" class="text-base font-bold text-stone-800 bg-stone-50 p-3 rounded-2xl border border-stone-200/70"></p>
        </div>

        <div>
          <span class="text-[11px] font-black text-stone-400 block mb-0.5">メモ</span>
          <p id="school-detail-memo" class="text-sm font-semibold text-stone-700 bg-stone-50 p-3 rounded-2xl border border-stone-200/70 whitespace-pre-wrap"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 学校：予定編集ポップアップ -->
  <div id="school-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col max-h-[92vh]">
      <div class="flex items-center justify-between mb-2 border-b border-stone-100 pb-2 flex-shrink-0">
        <div>
          <span class="text-xs font-bold text-emerald-600">学校の予定入力</span>
          <h3 id="school-modal-title" class="text-xl font-black text-stone-800"></h3>
        </div>
        <button onclick="closeSchoolModal()" class="p-2 hover:bg-stone-100 rounded-full text-stone-400">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <form onsubmit="handleSchoolSave(event)" class="space-y-3 overflow-y-auto custom-scrollbar pr-1 flex-1">
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="text-xs font-extrabold text-stone-600">じかん</label>
            <button type="button" onclick="toggleTimeInputMode()" id="toggle-input-mode-btn" class="text-[11px] font-bold text-emerald-600 hover:underline">
              文字で手入力する
            </button>
          </div>

          <div class="flex flex-wrap gap-1 mb-2">
            <button type="button" onclick="setQuickTime('5時間授業')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">5時間</button>
            <button type="button" onclick="setQuickTime('6時間授業')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">6時間</button>
            <button type="button" onclick="setQuickTime('給食後下校')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">給食後</button>
            <button type="button" onclick="setQuickTime('午前授業')" class="text-[11px] bg-stone-100 hover:bg-emerald-50 text-stone-600 font-bold px-2 py-0.5 rounded-lg border border-stone-200">午前</button>
          </div>

          <div id="wheel-picker-wrapper" class="relative bg-stone-50 border-2 border-stone-200 rounded-2xl p-2 h-32 flex items-center justify-center overflow-hidden">
            <div class="absolute inset-x-2 h-9 bg-emerald-500/15 border-y-2 border-emerald-500 rounded-lg pointer-events-none"></div>
            <div id="wheel-hours" class="wheel-container w-20 h-full overflow-y-scroll text-center py-11 custom-scrollbar"></div>
            <span class="text-base font-black text-stone-700 mx-2">:</span>
            <div id="wheel-minutes" class="wheel-container w-20 h-full overflow-y-scroll text-center py-11 custom-scrollbar"></div>
          </div>

          <div id="text-time-wrapper" class="hidden">
            <input
              type="text"
              id="school-input-time-text"
              placeholder="例: 14:30、5時間授業 など"
              class="w-full bg-stone-50 border-2 border-stone-200 focus:border-emerald-500 rounded-xl py-2 px-3 text-sm text-stone-800 outline-none"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-extrabold text-stone-600 mb-1">よてい</label>
          <input
            type="text"
            id="school-input-event"
            placeholder="例: 遠足、保護者会、身体測定 など"
            class="w-full bg-stone-50 border-2 border-stone-200 focus:border-emerald-500 rounded-xl py-2 px-3 text-sm text-stone-800 outline-none"
          >
        </div>

        <div>
          <label class="block text-xs font-extrabold text-stone-600 mb-1">メモ（持ち物・連絡事項など）</label>
          <textarea
            id="school-input-memo"
            rows="2"
            placeholder="例: お弁当持参、水筒、集金袋 など"
            class="w-full bg-stone-50 border-2 border-stone-200 focus:border-emerald-500 rounded-xl py-2 px-3 text-sm text-stone-800 outline-none resize-none"
          ></textarea>
        </div>

        <div class="flex space-x-2 pt-1">
          <button
            type="button"
            onclick="handleSchoolClear()"
            class="w-1/3 py-2.5 rounded-xl border border-stone-300 text-stone-500 font-bold text-xs hover:bg-stone-50"
          >
            クリア
          </button>
          <button
            type="submit"
            class="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-sm rounded-xl shadow-sm"
          >
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ===== Firebase設定 =====
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    let isFirebaseReady = false;

    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        isFirebaseReady = true;
      }
    } catch (e) {
      console.warn("Firebase未設定:", e);
    }

    const categories = ['shopping', 'school', 'schedule'];
    let currentCategory = 'shopping';
    let todos = JSON.parse(localStorage.getItem('kantan_todos') || '[]');
    let wordUsage = JSON.parse(localStorage.getItem('kantan_word_usage') || '{}');
    let schoolData = JSON.parse(localStorage.getItem('kantan_school_data') || '{}');

    const todayDate = new Date();
    const todayISO = `${todayDate.getFullYear()}-${String(todayDate.getMonth() + 1).padStart(2, '0')}-${String(todayDate.getDate()).padStart(2, '0')}`;
    
    let selectedScheduleDate = todayISO;
    let calDisplayYear = todayDate.getFullYear();
    let calDisplayMonth = todayDate.getMonth();

    let schoolMode = 'week';
    let currentWeekOffset = 0;
    let schoolDisplayYear = todayDate.getFullYear();
    let schoolDisplayMonth = todayDate.getMonth();

    let selectedSchoolDate = todayISO;
    let isTimeTextMode = false;
    let selectedWheelHour = '14';
    let selectedWheelMinute = '30';

    function init() {
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      document.getElementById('today-display').textContent = 
        `${todayDate.getFullYear()}年${todayDate.getMonth() + 1}月${todayDate.getDate()}日 (${days[todayDate.getDay()]})`;

      initWheelPicker();
      switchCategory('shopping');
      setupSwipeGestures();

      if (isFirebaseReady) {
        setupFirebaseSync();
      }

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#calendar-header-menu') && !e.target.closest('button[onclick="toggleCalendarHeaderMenu(event)"]')) {
          closeCalendarHeaderMenu();
        }
        if (!e.target.closest('#school-detail-menu') && !e.target.closest('button[onclick="toggleSchoolDetailMenu(event)"]')) {
          closeSchoolDetailMenu();
        }
      });
    }

    function setupFirebaseSync() {
      const syncEl = document.getElementById('sync-status');
      syncEl.textContent = 'クラウド同期中';
      syncEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';

      db.collection('kantan_memo').doc('shared_data').onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data.todos) {
            todos = data.todos;
            localStorage.setItem('kantan_todos', JSON.stringify(todos));
          }
          if (data.schoolData) {
            schoolData = data.schoolData;
            localStorage.setItem('kantan_school_data', JSON.stringify(schoolData));
          }
          if (data.wordUsage) {
            wordUsage = data.wordUsage;
            localStorage.setItem('kantan_word_usage', JSON.stringify(wordUsage));
          }
          renderCurrentViews();
        }
      });
    }

    function syncToCloud() {
      localStorage.setItem('kantan_todos', JSON.stringify(todos));
      localStorage.setItem('kantan_school_data', JSON.stringify(schoolData));
      localStorage.setItem('kantan_word_usage', JSON.stringify(wordUsage));

      if (isFirebaseReady && db) {

          todos: todos,
          schoolData: schoolData,
          wordUsage: wordUsage,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(err => console.error(err));
      }

    function setupSwipeGestures() {
      let touchStartX = 0;
      let touchStartY = 0;
      const mainContainer = document.getElementById('main-container');

      mainContainer.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      mainContainer.addEventListener('touchend', e => {
        const diffX = e.changedTouches[0].screenX - touchStartX;
        const diffY = e.changedTouches[0].screenY - touchStartY;

        if (Math.abs(diffX) > 60 && Math.abs(diffY) < 50) {
          const currentIndex = categories.indexOf(currentCategory);
          if (diffX < 0 && currentIndex < categories.length - 1) {
            switchCategory(categories[currentIndex + 1]);
          } else if (diffX > 0 && currentIndex > 0) {
            switchCategory(categories[currentIndex - 1]);
          }
          return;
        }

        if (currentCategory === 'school' && schoolMode === 'week') {
          if (Math.abs(diffY) > 40 && Math.abs(diffX) < 50) {
            if (diffY < 0) {
              changeSchoolPeriod(1);
            } else {
              changeSchoolPeriod(-1);
            }
          }
        }
      }, { passive: true });
    }

    // ===== 学校ビュー =====
    function setSchoolMode(mode) {
      schoolMode = mode;
      const modes = ['week', 'month', 'year'];
      modes.forEach(m => {
        const btn = document.getElementById(`btn-school-mode-${m}`);
        if (m === mode) {
          btn.className = 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white shadow-xs';
        } else {
          btn.className = 'px-2.5 py-1 rounded-lg text-stone-600';
        }
      });

      renderSchoolView();
    }

    function changeSchoolPeriod(delta) {
      if (schoolMode === 'week') {
        currentWeekOffset += delta;
      } else if (schoolMode === 'month') {
        schoolDisplayMonth += delta;
        if (schoolDisplayMonth < 0) { schoolDisplayMonth = 11; schoolDisplayYear--; }
        else if (schoolDisplayMonth > 11) { schoolDisplayMonth = 0; schoolDisplayYear++; }
      } else if (schoolMode === 'year') {
        schoolDisplayYear += delta;
      }
      renderSchoolView();
    }

    function resetSchoolPeriod() {
      currentWeekOffset = 0;
      schoolDisplayYear = todayDate.getFullYear();
      schoolDisplayMonth = todayDate.getMonth();
      renderSchoolView();
    }

    function renderSchoolView() {
      const weekStage = document.getElementById('school-week-stage');
      const monthStage = document.getElementById('school-month-stage');
      const yearStage = document.getElementById('school-year-stage');
      const periodLabel = document.getElementById('school-period-label');

      weekStage.classList.add('hidden');
      monthStage.classList.add('hidden');
      yearStage.classList.add('hidden');

      if (schoolMode === 'week') {
        weekStage.classList.remove('hidden');
        renderSchoolWeek();
      } else if (schoolMode === 'month') {
        monthStage.classList.remove('hidden');
        periodLabel.textContent = `${schoolDisplayYear}年 ${schoolDisplayMonth + 1}月`;
        renderSchoolMonthList();
      } else if (schoolMode === 'year') {
        yearStage.classList.remove('hidden');
        periodLabel.textContent = `${schoolDisplayYear}年`;
        renderSchoolYearList();
      }
      lucide.createIcons();
    }

    function getMondayOfWeek(offsetWeeks = 0) {
      const d = new Date(todayDate);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff + (offsetWeeks * 7)));
      return monday;
    }

    // iPhoneカレンダー書き出し機能（.icsファイル生成）
    function exportToICS() {
      let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Kantan Memo//School Schedule//JA\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";

      const entries = Object.entries(schoolData);
      if (entries.length === 0) {
        alert('書き出す学校の予定がまだありません。');
        return;
      }

      entries.forEach(([dateStr, info]) => {
        if (!info.event && !info.time && !info.memo) return;
        const cleanDate = dateStr.replace(/-/g, '');
        const summary = [info.time ? `[${info.time}]` : '', info.event || '学校の予定'].filter(Boolean).join(' ');
        const description = info.memo ? `メモ: ${info.memo}` : '';

        icsContent += "BEGIN:VEVENT\n";
        icsContent += `DTSTART;VALUE=DATE:${cleanDate}\n`;
        icsContent += `DTEND;VALUE=DATE:${cleanDate}\n`;
        icsContent += `SUMMARY:${summary}\n`;
        if (description) icsContent += `DESCRIPTION:${description}\n`;
        icsContent += "END:VEVENT\n";
      });

      icsContent += "END:VCALENDAR";

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'school_schedule.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderSchoolWeek() {
      const stage = document.getElementById('school-week-stage');
      stage.innerHTML = '';

      const monday = getMondayOfWeek(currentWeekOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const startM = monday.getMonth() + 1;
      const startD = monday.getDate();
      const endM = sunday.getMonth() + 1;
      const endD = sunday.getDate();
      
      document.getElementById('school-period-label').textContent = 
        (startM === endM) ? `${startM}/${startD}〜${endD}` : `${startM}/${startD}〜${endM}/${endD}`;

      const weekDays = ['月', '火', '水', '木', '金', '土', '日'];
      const primaryMonth = (new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 3)).getMonth();

      for (let i = 0; i < 7; i++) {
        const target = new Date(monday);
        target.setDate(monday.getDate() + i);

        const y = target.getFullYear();
        const m = target.getMonth();
        const dateNum = target.getDate();
        const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
        
        const info = schoolData[dStr] || { time: '', event: '', memo: '' };
        const hasData = Boolean(info.time || info.event || info.memo);
        const isToday = dStr === todayISO;
        const isOtherMonth = (m !== primaryMonth);
        const dayName = weekDays[i];

        let boxStyle = 'bg-white border border-stone-200 hover:border-emerald-300';
        let dayColor = 'text-stone-800';

        if (dayName === '土') {
          boxStyle = 'bg-sky-50/80 border border-sky-200 hover:border-sky-400';
          dayColor = 'text-sky-600 font-extrabold';
        } else if (dayName === '日') {
          boxStyle = 'bg-red-50/80 border border-red-200 hover:border-red-400';
          dayColor = 'text-red-600 font-extrabold';
        }

        if (isToday) {
          boxStyle += ' ring-2 ring-amber-400 border-amber-400 shadow-sm';
        } else if (isOtherMonth) {
          boxStyle = 'bg-stone-100/60 border border-stone-200/50 opacity-50';
          dayColor = 'text-stone-400';
        }

        const row = document.createElement('div');
        row.className = `flex-1 w-full px-3 py-1 rounded-2xl flex flex-col justify-center cursor-pointer transition-all active:scale-[0.98] ${boxStyle}`;
        
        row.onclick = () => {
          if (hasData) {
            openSchoolDetailModal(dStr);
          } else {
            openSchoolModal(dStr);
          }
        };

        const dateDisplay = isOtherMonth ? `${m + 1}/${dateNum}` : `${dateNum}`;

        row.innerHTML = `
          <div class="flex items-center justify-between min-w-0">
            <div class="flex items-center space-x-2 flex-1 min-w-0">
              <span class="text-sm font-black ${dayColor} flex-shrink-0 w-14">
                ${dateDisplay} (${dayName})
                ${isToday ? '<span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-500 align-middle ml-0.5"></span>' : ''}
              </span>
              
              <span class="text-sm font-black ${info.time ? 'text-emerald-800 bg-emerald-100/80 px-2 py-0.5 rounded-lg border border-emerald-200' : 'text-stone-300'} flex-shrink-0">
                ${info.time ? escapeHtml(info.time) : '-'}
              </span>

              <span class="text-sm font-bold text-stone-800 truncate flex-1 min-w-0">
                ${info.event ? escapeHtml(info.event) : '<span class="text-stone-300 font-normal text-xs">よていなし</span>'}
              </span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-stone-300 flex-shrink-0 ml-1"></i>
          </div>

          ${info.memo ? `
            <div class="mt-0.5 pt-0.5 border-t border-dashed border-stone-200 flex items-start space-x-1.5">
              <span class="text-[10px] font-black text-amber-700 bg-amber-100/70 px-1.5 py-0.2 rounded flex-shrink-0">メモ</span>
              <span class="text-xs font-semibold text-stone-600 truncate flex-1">${escapeHtml(info.memo)}</span>
            </div>
          ` : ''}
        `;
        stage.appendChild(row);
      }
    }

              <span class="text-xs font-semibold text-stone-600 truncate flex-1">${escapeHtml(info.memo)}</span>

        stage.appendChild(row);

    function renderSchoolYearList() {
      const stage = document.getElementById('school-year-stage');
      stage.innerHTML = '';

      for (let m = 0; m < 12; m++) {
        const monthNum = m + 1;
        const monthBox = document.createElement('div');
        monthBox.className = 'bg-white rounded-2xl p-3 border border-stone-200 shadow-2xs space-y-2';

        const monthEvents = Object.keys(schoolData).filter(key => {
          const parts = key.split('-');
          return parseInt(parts[0], 10) === schoolDisplayYear && parseInt(parts[1], 10) === monthNum && Boolean(schoolData[key].event);
        }).sort();

        let eventsHtml = '';
        if (monthEvents.length === 0) {
          eventsHtml = '<p class="text-xs text-stone-300 font-bold pl-1">予定はありません</p>';
        } else {
          eventsHtml = monthEvents.map(dateKey => {
            const dNum = parseInt(dateKey.split('-')[2], 10);
            const item = schoolData[dateKey];
            return `
              <div class="flex items-center space-x-2 text-xs py-1 border-b border-stone-100 last:border-none">
                <span class="font-extrabold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-lg w-12 text-center flex-shrink-0">${monthNum}/${dNum}</span>
                <span class="font-bold text-stone-800 truncate flex-1">${escapeHtml(item.event)}</span>
              </div>

        monthBox.innerHTML = `
          <div class="flex items-center justify-between border-b border-stone-100 pb-1.5">
            <span class="text-base font-black text-stone-800">${monthNum}月</span>
            <span class="text-xs font-bold ${monthEvents.length > 0 ? 'text-emerald-700 bg-emerald-100/70 px-2 py-0.5 rounded-full' : 'text-stone-400'}">

    function initWheelPicker() {
      const hWheel = document.getElementById('wheel-hours');
      const mWheel = document.getElementById('wheel-minutes');
      hWheel.innerHTML = '';
      mWheel.innerHTML = '';

      for (let h = 7; h <= 18; h++) {
        const val = String(h).padStart(2, '0');
        const item = document.createElement('div');
        item.className = 'wheel-item h-9 flex items-center justify-center font-extrabold text-base text-stone-700';
        item.textContent = val;
        item.dataset.value = val;
        hWheel.appendChild(item);
      }

      for (let m = 0; m < 60; m += 5) {
        const val = String(m).padStart(2, '0');
        const item = document.createElement('div');
        item.className = 'wheel-item h-9 flex items-center justify-center font-extrabold text-base text-stone-700';
        item.textContent = val;
        item.dataset.value = val;
        mWheel.appendChild(item);
      }

      hWheel.addEventListener('scroll', () => {
        const idx = Math.round(hWheel.scrollTop / 36);
        const child = hWheel.children[idx];
        if (child) selectedWheelHour = child.dataset.value;
      });

      mWheel.addEventListener('scroll', () => {
        const idx = Math.round(mWheel.scrollTop / 36);
        const child = mWheel.children[idx];
        if (child) selectedWheelMinute = child.dataset.value;
      });
    }

    function setWheelPosition(hour, minute) {
      const hWheel = document.getElementById('wheel-hours');
      const mWheel = document.getElementById('wheel-minutes');
      const hIndex = Math.max(0, parseInt(hour, 10) - 7);
      const mIndex = Math.max(0, Math.floor(parseInt(minute, 10) / 5));

      hWheel.scrollTop = hIndex * 36;
      mWheel.scrollTop = mIndex * 36;
      selectedWheelHour = String(hour).padStart(2, '0');
      selectedWheelMinute = String(minute).padStart(2, '0');
    }

    function handleSchoolSave(e) {
      e.preventDefault();
      let timeVal = isTimeTextMode ? document.getElementById('school-input-time-text').value.trim() : `${selectedWheelHour}:${selectedWheelMinute}`;
      const eventVal = document.getElementById('school-input-event').value.trim();
      const memoVal = document.getElementById('school-input-memo').value.trim();

      if (!timeVal && !eventVal && !memoVal) {
        delete schoolData[selectedSchoolDate];
      } else {
        schoolData[selectedSchoolDate] = { time: timeVal, event: eventVal, memo: memoVal };
      }

      syncToCloud();
      closeSchoolModal();
      renderSchoolView();
      renderCalendar();
      renderCalendarAutoList();
    }

    function handleSchoolClear() {
      document.getElementById('school-input-event').value = '';
      document.getElementById('school-input-memo').value = '';
      document.getElementById('school-input-time-text').value = '';
      delete schoolData[selectedSchoolDate];
      syncToCloud();
      closeSchoolModal();
      renderSchoolView();
      renderCalendar();
      renderCalendarAutoList();
    }

    function changeMonth(delta) {
      calDisplayMonth += delta;
      if (calDisplayMonth < 0) { calDisplayMonth = 11; calDisplayYear--; }
      else if (calDisplayMonth > 11) { calDisplayMonth = 0; calDisplayYear++; }
      renderCalendar();
    }

    function goToTodayMonth() {
      calDisplayYear = todayDate.getFullYear();
      calDisplayMonth = todayDate.getMonth();
      selectedScheduleDate = todayISO;
      renderCalendar();
      renderCalendarAutoList();
    }

    function renderCalendar() {
      document.getElementById('cal-month-year').textContent = `${calDisplayYear}年 ${calDisplayMonth + 1}月`;
      const grid = document.getElementById('cal-days-grid');
      grid.innerHTML = '';

      const firstDay = new Date(calDisplayYear, calDisplayMonth, 1).getDay();
      const lastDate = new Date(calDisplayYear, calDisplayMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'py-2';
        grid.appendChild(empty);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dStr = `${calDisplayYear}-${String(calDisplayMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayOfWeek = new Date(calDisplayYear, calDisplayMonth, d).getDay();
        
        const hasSchool = schoolData[dStr] && (schoolData[dStr].event || schoolData[dStr].time || schoolData[dStr].memo);
        const hasSchedule = todos.some(t => t.category === 'schedule' && t.date === dStr && !t.completed);
        const hasAny = hasSchool || hasSchedule;

        const isSelected = dStr === selectedScheduleDate;
        const isToday = dStr === todayISO;

        let btnStyle = 'bg-stone-50 border border-stone-200/60 text-stone-700';
        if (dayOfWeek === 6) {
          btnStyle = 'bg-sky-50 border border-sky-200 text-sky-600 font-extrabold';
        } else if (dayOfWeek === 0) {
          btnStyle = 'bg-red-50 border border-red-200 text-red-600 font-extrabold';
        }

        if (isSelected) {
          btnStyle = 'bg-sky-500 text-white font-black shadow-sm border border-sky-600';
        } else if (isToday) {
          btnStyle += ' ring-2 ring-amber-400 border-amber-400 font-extrabold';
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `py-2 rounded-xl flex flex-col items-center justify-center relative active:scale-95 transition-all ${btnStyle}`;

        btn.onclick = () => {
          selectedScheduleDate = dStr;
          renderCalendar();
          renderCalendarAutoList();
        };

        btn.innerHTML = `
          <span>${d}</span>
          ${hasAny ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : hasSchool ? 'bg-emerald-500' : 'bg-sky-500'} mt-0.5"></span>` : '<span class="w-1.5 h-1.5 mt-0.5"></span>'}
        `;
        grid.appendChild(btn);
      }
    }

    function renderCalendarAutoList() {
      const parts = selectedScheduleDate.split('-');
      const dObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
      
      const isToday = selectedScheduleDate === todayISO;
      document.getElementById('calendar-auto-badge').textContent = isToday ? '今日の予定' : '選択した日';
      document.getElementById('calendar-auto-date-title').textContent = 
        `${parseInt(parts[1], 10)}月${parseInt(parts[2], 10)}日 (${weekDays[dObj.getDay()]})`;

      const listEl = document.getElementById('calendar-auto-list');
      listEl.innerHTML = '';

      const dayTodos = todos.filter(t => t.category === 'schedule' && t.date === selectedScheduleDate);
      const hasSchool = schoolData[selectedScheduleDate] && (schoolData[selectedScheduleDate].event || schoolData[selectedScheduleDate].time || schoolData[selectedScheduleDate].memo);

      if (dayTodos.length === 0 && !hasSchool) {
        listEl.innerHTML = `
          <div class="text-center py-6">
            <p class="text-stone-400 font-bold text-xs">この日の予定はありません</p>
            <p class="text-stone-300 text-[11px] mt-0.5">右上の「︙」から予定を追加できます</p>
          </div>
        `;
        return;
      }

      if (hasSchool) {
        const s = schoolData[selectedScheduleDate];
        const textParts = [s.time ? `【${s.time}】` : '', s.event].filter(Boolean).join(' ');
        
        const sDiv = document.createElement('div');
        sDiv.className = 'p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 flex flex-col space-y-1';
        sDiv.innerHTML = `
          <div class="flex items-center space-x-1.5">
            <span class="text-[10px] font-black text-emerald-800 bg-white px-1.5 py-0.5 rounded border border-emerald-100 flex items-center">
              <i data-lucide="graduation-cap" class="w-3 h-3 mr-1"></i>学校
            </span>
            <span class="text-sm font-bold text-stone-800">${escapeHtml(textParts || '予定あり')}</span>
          </div>
          ${s.memo ? `<p class="text-xs text-stone-600 pl-1 border-t border-dashed border-emerald-200/70 pt-1"><span class="font-bold text-emerald-800">メモ: </span>${escapeHtml(s.memo)}</p>` : ''}
        `;
        listEl.appendChild(sDiv);
      }

      dayTodos.sort((a, b) => (a.completed === b.completed ? b.createdAt - a.createdAt : a.completed ? 1 : -1));

      dayTodos.forEach(item => {
        const div = document.createElement('div');
        div.className = `p-2.5 rounded-xl border flex items-center justify-between transition-all ${
          item.completed ? 'bg-stone-50 border-stone-200 opacity-60' : 'bg-white border-stone-200 shadow-2xs'
        }`;
        
        div.innerHTML = `
          <div class="flex items-center space-x-2.5 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleTodo('${item.id}'); renderCalendarAutoList();">
            <div class="w-5 h-5 rounded-lg border-2 flex items-center justify-center flex-shrink-0 transition-colors ${
              item.completed ? 'bg-sky-500 border-sky-500 text-white' : 'border-stone-300 bg-stone-50'
            }">
              ${item.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
            </div>
            <span class="text-sm font-bold text-stone-800 break-words flex-1 min-w-0 ${item.completed ? 'line-through text-stone-400' : ''}">
              ${escapeHtml(item.text)}
            </span>
          </div>
          <button onclick="deleteTodo('${item.id}'); renderCalendarAutoList();" class="p-1 text-stone-300 hover:text-red-500 flex-shrink-0" title="削除">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        `;
        listEl.appendChild(div);
      });

      lucide.createIcons();
    }

    function toggleCalendarHeaderMenu(e) {
      e.stopPropagation();
      const menu = document.getElementById('calendar-header-menu');
      menu.classList.toggle('hidden');
    }

    function closeCalendarHeaderMenu() {
      const menu = document.getElementById('calendar-header-menu');
      if (menu) menu.classList.add('hidden');
    }

    function promptAddCalendarTodo() {
      closeCalendarHeaderMenu();
      const text = prompt('予定を入力してください:');
      if (text && text.trim()) {
        todos.push({
          id: 'todo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          text: text.trim(),
          category: 'schedule',
          date: selectedScheduleDate,
          completed: false,
          createdAt: Date.now()
        });
        syncToCloud();
        renderCalendar();
        renderCalendarAutoList();
      }
    }

    function promptEditSelectedDay() {
      closeCalendarHeaderMenu();
      const dayTodos = todos.filter(t => t.category === 'schedule' && t.date === selectedScheduleDate);
      const hasSchool = schoolData[selectedScheduleDate] && (schoolData[selectedScheduleDate].event || schoolData[selectedScheduleDate].time || schoolData[selectedScheduleDate].memo);

      if (hasSchool && dayTodos.length === 0) {
        openSchoolModal(selectedScheduleDate);
      } else if (dayTodos.length > 0) {
        const item = dayTodos[0];
        const newText = prompt('予定を編集:', item.text);
        if (newText !== null && newText.trim()) {
          item.text = newText.trim();
          syncToCloud();
          renderCalendarAutoList();
        }
      } else {
        alert('編集できる予定がありません。「追加」から新しい予定を入れてください。');
      }
    }

    function promptClearSelectedDay() {
      closeCalendarHeaderMenu();
      if (confirm('この日の予定を消去しますか？')) {
        todos = todos.filter(t => !(t.category === 'schedule' && t.date === selectedScheduleDate));
        delete schoolData[selectedScheduleDate];
        syncToCloud();
        renderCalendar();
        renderCalendarAutoList();
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;

      addTodo(text);
      input.value = '';
    }

    function addTodo(text) {
      const newTodo = {
        id: 'todo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        text: text,
        category: currentCategory,
        completed: false,
        createdAt: Date.now()
      };

      todos.push(newTodo);
      wordUsage[text] = (wordUsage[text] || 0) + 1;
      syncToCloud();

      renderFrequentChips();
      renderTodos();
    }

    function renderFrequentChips() {
      const container = document.getElementById('frequent-container');
      const chips = document.getElementById('frequent-chips');
      chips.innerHTML = '';

      const topWords = Object.entries(wordUsage)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(entry => entry[0]);

      if (topWords.length === 0) {
        container.classList.add('hidden');
        container.classList.remove('flex');
        return;
      }

      container.classList.remove('hidden');
      container.classList.add('flex');

      topWords.forEach(word => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'bg-white border border-stone-200/90 text-stone-700 px-2.5 py-1 rounded-full font-bold shadow-2xs active:bg-amber-50 flex items-center hover:border-amber-300';
        chip.innerHTML = `<span>+ ${escapeHtml(word)}</span>`;
        chip.onclick = () => addTodo(word);
        chips.appendChild(chip);
      });
    }

    function toggleTodo(id) {
      const item = todos.find(t => t.id === id);
      if (item) {
        item.completed = !item.completed;
        syncToCloud();
        renderTodos();
        renderCalendar();
      }
    }

    function deleteTodo(id) {
      todos = todos.filter(t => t.id !== id);
      syncToCloud();
      renderTodos();
      renderCalendar();
    }

    function clearCompletedTodos() {
      todos = todos.filter(t => !(t.category === currentCategory && t.completed));
      syncToCloud();
      renderTodos();
    }

    function renderTodos() {
      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = '';

      const activeItems = todos.filter(t => t.category === 'shopping');
      activeItems.sort((a, b) => (a.completed === b.completed ? b.createdAt - a.createdAt : a.completed ? 1 : -1));

      const remaining = activeItems.filter(t => !t.completed).length;
      const completedCount = activeItems.filter(t => t.completed).length;
      
      document.getElementById('remaining-count').textContent = `あと ${remaining} つ`;

      const clearBtn = document.getElementById('clear-completed-btn');
      if (completedCount > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      if (activeItems.length === 0) {
        listEl.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 text-stone-400">
            <i data-lucide="smile" class="w-12 h-12 mb-2 stroke-1"></i>
            <p class="font-bold text-sm">メモはありません</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      activeItems.forEach(todo => {
        const li = document.createElement('li');
        li.className = `p-3 rounded-2xl border transition-all flex items-center justify-between ${
          todo.completed ? 'bg-stone-100/80 border-stone-200 opacity-60' : 'bg-white border-stone-200 shadow-2xs'
        }`;

        li.innerHTML = `
          <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleTodo('${todo.id}')">
            <div class="w-7 h-7 rounded-xl border-2 flex items-center justify-center flex-shrink-0 transition-colors ${
              todo.completed ? 'bg-amber-500 border-amber-500 text-white' : 'border-stone-300 bg-stone-50'
            }">
              ${todo.completed ? '<i data-lucide="check" class="w-5 h-5 stroke-[3]"></i>' : ''}
            </div>
            <span class="text-base font-bold text-stone-800 break-words flex-1 min-w-0 ${todo.completed ? 'line-through text-stone-400 font-medium' : ''}">
              ${escapeHtml(todo.text)}
            </span>
          </div>
          <button onclick="deleteTodo('${todo.id}')" class="p-2 text-stone-300 hover:text-red-500 active:scale-90 transition-all rounded-lg" title="削除">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        `;
        listEl.appendChild(li);
      });

      lucide.createIcons();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.onload = init;
  </script>
</body>
</html>
